[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# SCOPE SCALPING (set. 2026-09): in pausa i test non-scalping — file conservati, esclusi dalla run.
# Per rieseguirli: pytest tests/integration tests/audit tests/e2e tests/test_connectivity.py tests/test_main.py
addopts = --ignore=tests/audit --ignore=tests/e2e --ignore=tests/integration --ignore=tests/test_connectivity.py --ignore=tests/test_main.py
