name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'synthtrade/frontend/synthtrade-ui/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: synthtrade/frontend/synthtrade-ui/package-lock.json

      - name: Install dependencies
        working-directory: synthtrade/frontend/synthtrade-ui
        run: npm ci

      - name: Build
        working-directory: synthtrade/frontend/synthtrade-ui
        run: npm run build:prod

      - name: Add .nojekyll
        run: touch synthtrade/frontend/synthtrade-ui/dist/synthtrade-ui/browser/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: synthtrade/frontend/synthtrade-ui/dist/synthtrade-ui/browser
          publish_branch: gh-pages
