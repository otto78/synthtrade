name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'synthtrade/frontend/synthtrade-ui/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: synthtrade/frontend/synthtrade-ui/package-lock.json

      - name: Install dependencies
        working-directory: synthtrade/frontend/synthtrade-ui
        run: npm ci

      - name: Build
        working-directory: synthtrade/frontend/synthtrade-ui
        run: npm run build:prod

      - name: Add .nojekyll
        run: touch synthtrade/frontend/synthtrade-ui/dist/synthtrade-ui/browser/.nojekyll

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: synthtrade/frontend/synthtrade-ui/dist/synthtrade-ui/browser

      - uses: actions/deploy-pages@v4
        id: deployment
